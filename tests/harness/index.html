<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House Control card test page</title>
    <style>html, body { margin: 0; height: 100%; background: #111; } #view { height: 100vh; }</style>
  </head>
  <body>
    <div id="view"></div>
    <script type="module">
      // Mounts the built card with a mock hass, the way a Lovelace panel view would.
      import '/dist/shrumslab-ha3d.js';
      import { createMockHass, demoStates, handleHassAction } from './mock-hass.js';
      import { manyLightsPlan, manyLightsStates } from './many-lights.js';

      const params = new URLSearchParams(location.search);
      const Card = customElements.get('house-control-card');
      // ?plan=many: the 50-light plan of the light-budget test; ?quality=low|medium|high
      const many = params.get('plan') === 'many';
      const config = { type: 'custom:house-control-card', ...(many ? { plan: manyLightsPlan() } : Card.getStubConfig()), height: '100vh' };
      if (params.get('quality')) config.quality = params.get('quality');
      if (!many) config.power = 'sensor.demo_house_power';
      if (params.get('sun')) config.sun = true; // ?sun=1
      if (params.get('full_bleed')) config.full_bleed = true; // ?full_bleed=1
      for (const key of ['animation_fps', 'idle_pause']) if (params.get(key)) config[key] = Number(params.get(key)); // ?idle_pause=2
      if (params.get('debug_stats')) config.debug_stats = true; // ?debug_stats=1
      const hass = createMockHass({
        states: many ? { ...demoStates(), ...manyLightsStates(20) } : demoStates(),
        registry: params.get('registry') === 'ws' ? 'ws' : true, // ?registry=ws: only the websocket commands
        admin: params.get('admin') !== '0',
        fahrenheit: params.get('unit') === 'F',
        dashboard: { views: [{ type: 'panel', cards: [structuredClone(config)] }] },
      });
      const card = document.createElement('house-control-card');
      card.setConfig(config);
      const push = () => { card.hass = { ...hass, states: hass.states }; };
      hass.listeners.add(push);
      push();
      document.getElementById('view').append(card);
      window.__test = { card, hass, config, events: [] };
      window.addEventListener('hass-more-info', (e) => window.__test.events.push({ type: 'hass-more-info', entityId: e.detail.entityId }));
      // the frontend's action handling (src/state/action-mixin.ts), for the card's hass-action events
      window.addEventListener('hass-action', (e) => handleHassAction(hass, e.detail, (ev) => window.__test.events.push(ev)));
    </script>
  </body>
</html>
