name: Release

# A tag v* builds the card, runs every check and attaches the bundle to a DRAFT release.
# Publishing the release (which is what HACS installs) is done by hand after review.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Version matches the tag
        run: |
          version=$(node -p "require('./package.json').version")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "package.json has $version, the tag is $GITHUB_REF_NAME"; exit 1; }

      - run: npm run lint
      - run: npm test
      - run: npm run privacy

      # The gitleaks action fails on a branch's first push (it asks git for the root commit's
      # parent), so the release binary scans the whole history instead.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.24.3
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --redact --verbose --exit-code 1

      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:render

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/shrumslab-ha3d.js
